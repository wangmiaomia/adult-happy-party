<style>

.object{width:min(96%,720px);margin:43px auto 0}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{min-height:48px;border-radius:999px;padding:0 19px;font-weight:900;cursor:pointer}.primary{border:0}.secondary{border:1px solid currentColor;background:transparent;color:inherit}.status{min-height:28px;margin-top:10px;text-align:center;font:700 10px/1.6 ui-monospace,monospace}
.inside{max-width:980px;margin:auto;padding:42px 10px}.topline{display:flex;justify-content:space-between;gap:16px}.eye{font-size:9px;letter-spacing:.18em;opacity:.65}.serial{font:800 10px/1 ui-monospace,monospace;opacity:.58}

.date{min-width:0;padding:28px 30px;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-self:stretch;height:100%}.dateBig{font:800 clamp(64px,9vw,108px)/.82 ui-monospace,monospace;letter-spacing:-.08em}.dateMeta{display:flex;justify-content:space-between;margin-top:15px;font-size:11px}
.section{margin-top:34px}.sectionHead{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:15px}.sectionHead:before{content:"";height:1px;flex:1;background:currentColor;opacity:.14}.sectionHead b{font:22px var(--serif);white-space:nowrap;text-align:center}.sectionHead i{height:1px;flex:1;background:currentColor;opacity:.14}
.infoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.info,.right,.time span,.rule{padding:17px 15px;border-radius:16px;text-align:center}.info{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center}.info small,.right small,.rule small{display:block;font-size:9px;letter-spacing:.15em;opacity:.58;margin-bottom:8px}.info b,.right b{font-size:15px;line-height:1.55}.rights{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.right{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center}.num{font:800 24px/1 ui-monospace,monospace;opacity:.24}.right b{display:block;margin-top:15px}
.timeline{display:grid;gap:11px;position:relative}.timeline:before{content:"";position:absolute;left:17px;top:8px;bottom:8px;width:1px;background:currentColor;opacity:.16}.time{display:grid;grid-template-columns:35px 70px 1fr;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;justify-self:center}.time time{font:800 12px ui-monospace,monospace;opacity:.66;text-align:center}.time span{font-size:14px;font-weight:750;line-height:1.6;text-align:center}.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rule{min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center}.rule b{font-size:14px;line-height:1.82}

.actionBar{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-top:22px}.confirm,.menuBtn,.eggBtn{min-height:52px;border-radius:14px;padding:0 17px;font-weight:900;cursor:pointer}.confirm{border:0}.menuBtn,.eggBtn{border:1px solid currentColor;background:transparent;color:inherit}.drawer{display:none;margin-top:12px}.drawer.show{display:block;animation:rise .28s ease}.panel{padding:17px;border-radius:16px;font-size:12px;line-height:1.8}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.menuGrid div{padding:12px;border-radius:12px}.menuGrid b{display:block;font-size:12px;margin-bottom:4px}.menuGrid span{font-size:10px;opacity:.68}.eggTitle{font:22px var(--serif);margin-bottom:8px}.eggReveal{margin-top:12px;min-height:45px;border-radius:12px;border:1px dashed currentColor;background:transparent;color:inherit;padding:0 14px;font-weight:900;cursor:pointer}.eggResult{display:none;margin-top:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}.eggResult.show{display:block}

/* front 01 */

.case{
height:390px;border-radius:26px;position:relative;overflow:hidden;
background:
linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/18px 18px,

padding:28px;color:#f7edd1
}
