<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1513"><meta name="description" content="成年人放风派对专属互动邀请函"><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><title>成年人放风派对｜专属邀请</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08110f;color:#f6efe0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{display:grid;place-items:center;padding:24px;overflow:hidden}.wrap{text-align:center;max-width:520px}.seal{width:96px;height:96px;margin:0 auto 24px;border:2px solid #d7b56d;border-radius:50%;display:grid;place-items:center;font-family:"Songti SC",serif;font-size:22px;letter-spacing:.14em;color:#e7cd96;position:relative;animation:pulse 1.7s ease-in-out infinite}.seal:after{content:"";position:absolute;inset:-12px;border:1px solid rgba(215,181,109,.18);border-radius:50%;animation:ring 1.7s ease-out infinite}h1{font-family:"Songti SC",serif;font-size:clamp(30px,8vw,50px);margin:0 0 12px}p{color:#aebbb5;line-height:1.8;margin:0}.dots{display:flex;gap:7px;justify-content:center;margin-top:24px}.dots i{width:6px;height:6px;border-radius:50%;background:#d7b56d;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}.fallback{display:none;margin-top:22px}.fallback a{display:inline-block;padding:12px 18px;border-radius:999px;background:#d7b56d;color:#14221e;text-decoration:none;font-weight:800}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 36px rgba(215,181,109,.18)}}@keyframes ring{to{transform:scale(1.25);opacity:0}}@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head>
<body><main class="wrap"><div class="seal">邀<br>请</div><h1 id="title">正在打开你的专属邀请</h1><p id="sub">请稍候，快乐模式正在载入。</p><div class="dots"><i></i><i></i><i></i></div><div class="fallback" id="fallback"><a id="go" href="./01.html">继续打开</a></div></main>
<script>(()=>{const q=new URLSearchParams(location.search);let t=(q.get('theme')||'01').replace(/\D/g,'').padStart(2,'0');if(!['01','02','03','04','05'].includes(t))t='01';q.set('theme',t);const target=`./${t}.html?${q.toString()}`;const go=document.getElementById('go');go.href=target;const name=(q.get('to')||q.get('name')||'').trim();if(name)document.getElementById('title').textContent=`${name}，你有一份专属邀请`;setTimeout(()=>{location.replace(target)},650);setTimeout(()=>{document.getElementById('fallback').style.display='block'},1800)})();</script></body></html>
